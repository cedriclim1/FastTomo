[build-system]
requires = ["scikit-build-core>=0.3", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "fasttomo"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.11", "numpy", "tqdm", "packaging"]

[project.optional-dependencies]
bench = ["scikit-image", "astra-toolbox"]

[project.urls]
Homepage = "https://github.com/cedriclim1/FastTomo"
Repository = "https://github.com/cedriclim1/FastTomo"

[tool.scikit-build]
cmake.version = ">=3.18"
cmake.build-type = "Release"
wheel.packages = ["fasttomo"]

[tool.ruff.lint]
# ruff's classic default rule set, pinned so newer ruff releases (which
# widen the default) do not change what `ruff check fasttomo tests` reports.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# the version and CUDA checks must run before the extension is imported
"fasttomo/__init__.py" = ["E402"]
