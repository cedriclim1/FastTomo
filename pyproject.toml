[build-system]
requires = ["scikit-build-core>=0.3", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[project]
name = "fasttomo"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["torch", "numpy", "tqdm"]

[project.optional-dependencies]
bench = ["scikit-image", "astra-toolbox"]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["fasttomo"]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "pp* *-musllinux*"
test-command = "python -c 'import torch, fasttomo as ft; vol=torch.zeros(1,16,16); ang=torch.linspace(-60,60,12); sino=ft.forward_project(vol, ang); assert sino.shape == (12, 1, 16)'"

[tool.cibuildwheel.environment]
CMAKE_ARGS = "-DCMAKE_CUDA_COMPILER=CMAKE_CUDA_COMPILER-NOTFOUND"
