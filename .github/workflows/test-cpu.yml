name: CPU tests

# Builds the extension CPU-only (FASTTOMO_USE_CUDA=OFF) against PyTorch's
# CPU wheel and runs the whole test suite. GitHub runners have no GPU, so
# the CUDA tests (marked `gpu` by tests/conftest.py: the `cuda` case of the
# `backend` fixture and every test skipped without CUDA) skip themselves;
# everything else must pass.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on pull requests only. In-progress runs on main are
# not cancelled, but a queued run in the same group is still replaced by a
# newer queued one, so in a burst of merges a middle commit may go untested.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: pytest (CPU, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (requires-python >= 3.10) and the main dev version.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CPU PyTorch and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy tqdm packaging pytest ruff==0.16.9

      - name: Build and install FastTomo (CPU-only)
        run: python -m pip install . -Ccmake.define.FASTTOMO_USE_CUDA=OFF

      # Invoke the `pytest` entry point, not `python -m pytest`: the latter
      # puts the repo root on sys.path, so `import fasttomo` would pick up the
      # source tree (which has no compiled _core) instead of the installed
      # package.
      - name: Run tests
        env:
          FASTTOMO_EXPECT_CUDA: "0"
        run: pytest tests -q

      # Rule set pinned in pyproject.toml ([tool.ruff.lint]); the ruff version
      # is pinned above so new upstream rules cannot turn CI red on their own.
      - name: Ruff
        run: ruff check fasttomo tests
