name: CPU tests

# Builds the extension CPU-only (FASTTOMO_USE_CUDA=OFF) against PyTorch's
# CPU wheel and runs the whole test suite. GitHub runners have no GPU, so
# CUDA-only tests (tests/test_cuda.py, tests/test_projector_cache.py and the
# CUDA cases elsewhere) skip themselves; everything else must pass.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (CPU, Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU PyTorch and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy tqdm packaging pytest ruff

      - name: Build and install FastTomo (CPU-only)
        run: python -m pip install . -Ccmake.define.FASTTOMO_USE_CUDA=OFF

      # Invoke the `pytest` entry point, not `python -m pytest`: the latter
      # puts the repo root on sys.path, so `import fasttomo` would pick up the
      # source tree (which has no compiled _core) instead of the installed
      # package.
      - name: Run tests
        env:
          FASTTOMO_EXPECT_CUDA: "0"
        run: pytest tests -q

      # Non-blocking until the existing warnings are cleaned up.
      - name: Ruff (non-blocking)
        continue-on-error: true
        run: ruff check fasttomo tests
